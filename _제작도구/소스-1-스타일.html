<meta charset="utf-8">
<title>충주 클로드코드 워크숍</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 밤에 여는 워크숍이라 페이지도 밤이다 — 단일 테마로 고정한다.
   사진이 전부 야간 실내 컷이라 검은 지면 위에서 가장자리가 지면과 이어진다. */
:root{
  color-scheme:dark;

  --paper:#0A0A09;
  --ink:#F2F0E9;
  --mute:#161614;
  --ink-80:rgba(242,240,233,.80);
  --ink-55:rgba(242,240,233,.56);
  --ink-35:rgba(242,240,233,.34);
  --ink-14:rgba(242,240,233,.17);
  --ink-06:rgba(242,240,233,.07);
  --rule:#F2F0E9;

  --c-mag:#FF4FAC;
  --c-yel:#FFE500;
  --c-blu:#8AA5FF;
  --c-grn:#5FD256;
  --on-yel:#0A0A09;

  --display:"Black Han Sans","IBM Plex Sans KR",system-ui,"Malgun Gothic",sans-serif;
  --sans:"IBM Plex Sans KR","IBM Plex Sans",system-ui,"Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;

  --gutter:clamp(18px,5vw,64px);
  --maxw:1140px;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.72;
  word-break:keep-all;
  overflow-wrap:anywhere;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block}
a{color:inherit}

/* ── 골격 ───────────────────────────────── */
.wrap{max-width:var(--maxw);margin:0 auto;padding-inline:var(--gutter)}
section{border-top:2.5px solid var(--rule)}
section.plain{border-top:0}
.sec{padding-block:clamp(48px,7vw,92px)}

/* 세로 레일 — 섹션 라벨과 본문을 잇는다 */
.rail{
  display:grid;
  grid-template-columns:minmax(120px,168px) 1fr;
  gap:clamp(20px,4vw,52px);
  align-items:start;
}
.rail > .lab{position:relative;padding-top:4px}
.lab .no{
  font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.14em;
  color:var(--ink-55);display:block;margin-bottom:10px;
}
.lab .tag{
  font-family:var(--mono);font-size:12.5px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;display:block;line-height:1.5;
}
.lab::after{
  content:"";position:absolute;left:0;top:calc(100% + 14px);
  width:1.5px;height:0;background:var(--ink-14);
}
@media (min-width:760px){
  .lab::after{height:calc(100% + 40px)}
}
/* 좁은 화면에서는 레일을 눕힌다 — 2열을 유지하면 본문이 낱말 단위로 쪼개진다 */
@media (max-width:759px){
  .rail{grid-template-columns:1fr;gap:16px}
  .rail > .lab{padding-top:0;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .lab .no{margin-bottom:0}
  .lab .tag br{display:none}
}

h2{
  font-family:var(--display);font-weight:400;
  font-size:clamp(30px,5.4vw,56px);
  line-height:1.1;letter-spacing:-.01em;
  margin:0 0 26px;text-wrap:balance;
}
h3{
  font-family:var(--display);font-weight:400;
  font-size:clamp(20px,2.6vw,27px);line-height:1.25;
  margin:0 0 10px;text-wrap:balance;
}
p{margin:0 0 16px;max-width:64ch}
p:last-child{margin-bottom:0}
.lede{font-size:clamp(17px,2vw,20px);line-height:1.66;color:var(--ink-80)}
strong{font-weight:600}
.u{font-weight:600;color:var(--ink);box-shadow:inset 0 -2px 0 0 var(--c-yel)}
.mono{font-family:var(--mono);font-size:.92em;letter-spacing:.01em}
.dim{color:var(--ink-55)}

/* ── 히어로 ─────────────────────────────── */
.hero{padding-block:clamp(30px,5vw,54px) clamp(40px,6vw,70px)}
.brandbar{
  display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;
  font-family:var(--mono);font-size:12.5px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;padding-block:18px 26px;
}
.brandbar .dot{width:9px;height:9px;background:var(--c-mag);flex:none}
.brandbar .sep{color:var(--ink-35)}
h1{
  font-family:var(--display);font-weight:400;
  font-size:clamp(42px,10.4vw,98px);
  line-height:.98;letter-spacing:-.02em;
  margin:0 0 26px;
}
h1 .line{display:block}
h1 .neg{
  position:relative;display:inline-block;
}
h1 .neg::after{
  content:"";position:absolute;left:-.02em;right:-.02em;top:52%;height:.075em;
  background:var(--c-mag);
}
.hero-grid{
  display:grid;grid-template-columns:1fr;gap:clamp(24px,3.5vw,44px);
  align-items:end;
}
@media (min-width:880px){
  .hero-grid{grid-template-columns:1.08fr .92fr}
}
.hero-sub{max-width:52ch}

/* 정보 스트립 */
.facts{
  display:grid;grid-template-columns:repeat(2,1fr);
  border-top:2.5px solid var(--rule);border-left:1.5px solid var(--ink-14);
}
@media (min-width:620px){.facts{grid-template-columns:repeat(4,1fr)}}
.facts > div{
  border-right:1.5px solid var(--ink-14);border-bottom:1.5px solid var(--ink-14);
  padding:14px 14px 16px;
}
.facts dt{
  font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-55);margin-bottom:6px;
}
.facts dd{
  margin:0;font-family:var(--display);font-weight:400;
  font-size:clamp(19px,2.5vw,25px);line-height:1.18;
  font-variant-numeric:tabular-nums;
}
.facts dd small{font-family:var(--sans);font-size:12.5px;font-weight:500;color:var(--ink-55);display:block;line-height:1.5;margin-top:3px}

/* 사진 */
figure{margin:0}
.ph img{width:100%;height:auto;filter:saturate(1.02)}
.ph figcaption{
  font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;
  color:var(--ink-55);padding-top:9px;line-height:1.55;
  border-top:1.5px solid var(--ink-14);margin-top:9px;
}
.band{border-top:2.5px solid var(--rule)}
.band img{width:100%;height:clamp(200px,38vw,430px);object-fit:cover}
.band figcaption{
  max-width:var(--maxw);margin:0 auto;padding:10px var(--gutter) 0;
  font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:var(--ink-55);
}

/* ── 대비표 ─────────────────────────────── */
.versus{display:grid;grid-template-columns:1fr;gap:0;margin-top:6px}
@media (min-width:720px){.versus{grid-template-columns:1fr 1fr}}
.vs-col{border-top:1.5px solid var(--ink-14);padding-top:16px}
@media (min-width:720px){
  .vs-col:first-child{padding-right:clamp(18px,3vw,40px)}
  .vs-col:last-child{padding-left:clamp(18px,3vw,40px);border-left:1.5px solid var(--ink-14);border-top:1.5px solid var(--ink-14)}
}
@media (max-width:719px){.vs-col:last-child{margin-top:26px}}
.vs-col h3{font-size:clamp(18px,2.3vw,22px);margin-bottom:14px}
.vs-col.here h3{color:var(--c-mag)}
.vs-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}
.vs-list li{display:flex;gap:11px;align-items:baseline;line-height:1.6}
.vs-list .mk{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink-35);flex:none;width:14px}
.vs-col.here .vs-list .mk{color:var(--c-mag)}

/* ── 통증 ───────────────────────────────── */
.pains{display:grid;grid-template-columns:1fr;gap:0}
@media (min-width:760px){.pains{grid-template-columns:repeat(3,1fr)}}
.pain{border-top:1.5px solid var(--ink-14);padding:18px 0 0}
@media (min-width:760px){
  .pain{padding:18px clamp(14px,2vw,26px) 0 0}
  .pain + .pain{border-left:1.5px solid var(--ink-14);padding-left:clamp(16px,2.2vw,30px)}
}
@media (max-width:759px){.pain + .pain{margin-top:22px}}
.pain .n{
  font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.12em;
  color:var(--c-mag);display:block;margin-bottom:9px;
}
.pain p{font-size:15px;color:var(--ink-80);margin:0}
.pain .quote{
  margin-top:12px;padding-left:13px;border-left:2.5px solid var(--c-yel);
  font-size:14.5px;color:var(--ink-55);line-height:1.6;
}
</style>
